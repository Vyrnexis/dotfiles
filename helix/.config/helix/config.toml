# Helix 25.07 Configuration
# ~/.config/helix/config.toml

theme = "catppuccin_mocha"

# ── Editor ────────────────────────────────────────────────────────────
[editor]
line-number = "relative"
mouse = true
cursorline = true
bufferline = "multiple"
auto-save = { focus-lost = true, after-delay.enable = true, after-delay.timeout = 5000 }
color-modes = true
true-color = true
idle-timeout = 250
completion-trigger-len = 1
text-width = 100
default-line-ending = "lf"
popup-border = "all"
end-of-line-diagnostics = "hint"
auto-pairs = true

[editor.search]
smart-case = true
wrap-around = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = true

# ── Statusline ────────────────────────────────────────────────────────
[editor.statusline]
left = ["mode", "spinner", "version-control", "spacer", "diagnostics"]
center = ["file-name", "file-modification-indicator", "read-only-indicator"]
right = ["selections", "register", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"

[editor.statusline.mode]
normal = "NOR"
insert = "INS"
select = "SEL"

# ── LSP ───────────────────────────────────────────────────────────────
[editor.lsp]
display-messages = true
display-inlay-hints = true
auto-signature-help = true
snippets = true

# ── Indent Guides ─────────────────────────────────────────────────────
[editor.indent-guides]
render = true
character = "│"
skip-levels = 0                  # Shows root indentation guides for Nim procs/types

# ── Gutters ───────────────────────────────────────────────────────────
[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

# ── Soft Wrap ─────────────────────────────────────────────────────────
[editor.soft-wrap]
enable = true
wrap-at-text-width = true

# ── Smart Tab ─────────────────────────────────────────────────────────
[editor.smart-tab]
enable = true

# ── Whitespace Rendering ──────────────────────────────────────────────
[editor.whitespace.render]
space = "none"
tab = "all"
nbsp = "all"
newline = "none"

# ── Keybindings ───────────────────────────────────────────────────────
[keys.normal]
X = "extend_line_above"
esc = ["collapse_selection", "keep_primary_selection"]

# Indentation shifting
">" = "indent"
"<" = "unindent"

# Vim-style motions
"%" = "match_brackets"
"*" = ["move_char_right", "move_prev_word_start", "move_next_word_end", "search_selection", "search_next"]
"#" = ["move_char_right", "move_prev_word_start", "move_next_word_end", "search_selection", "search_prev"]
"$" = "goto_line_end"
0 = "goto_line_start"
G = "goto_file_end"

# Quick save / quit
C-s = ":write"
C-q = ":quit"

# Buffer navigation
C-h = ":buffer-previous"
C-l = ":buffer-next"

# Superfile file picker
C-e = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output sh -c "spf --chooser-file=/tmp/unique-file < /dev/tty > /dev/tty"',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

# Lazygit integration
C-g = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]

[keys.normal.space]
e = "file_explorer"
E = "file_explorer_in_current_buffer_directory"

[keys.insert]
C-s = ":write"

[keys.select]
X = "extend_line_above"
">" = "indent"
"<" = "unindent"
