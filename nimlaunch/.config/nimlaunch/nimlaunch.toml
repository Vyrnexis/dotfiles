# Personal NimLaunch configuration managed by GNU Stow.

[window]
width = 500
opacity = 1.0
max_visible_items = 10
center = true
position_x = 20
position_y = 500
vertical_align = "one-third"
display = 0

[font]
fontname = "JetBrainsMono Nerd Font:size=16"

[input]
prompt = "> "
cursor = "_"
vim_mode = false

[terminal]
program = "kitty"

[border]
width = 2

[icons]
enabled = true

# ==========================
# Search shortcuts
# ==========================

[[shortcuts]]
prefix = ":g"
label  = "Search Google: "
base   = "https://www.google.com/search?q={query}"
mode   = "url"

[[shortcuts]]
prefix = ":w"
label  = "Search Wiki: "
base   = "https://en.wikipedia.org/wiki/Special:Search?search={query}"
mode   = "url"

[[shortcuts]]
prefix = ":y"
label  = "Search YouTube: "
base   = "https://www.youtube.com/results?search_query={query}"
mode   = "url"

[[shortcuts]]
prefix = ":man"
label  = "Man page search: "
base   = "https://man.archlinux.org/search?q={query}"
mode   = "url"

[[shortcuts]]
prefix = ":gh"
label  = "Search GitHub: "
base   = "https://github.com/search?q={query}&type=code"
mode   = "url"

[[shortcuts]]
prefix = ":aw"
label  = "Search Arch Wiki: "
base   = "https://wiki.archlinux.org/index.php?search={query}"
mode   = "url"

# ==========================
# Groups
# ==========================
[[groups]]
name = "sys"
query_mode = "filter"

[[groups]]
name = "svc"
query_mode = "pass"

[[groups]]
name = "docs"
query_mode = "filter"

[[groups]]
name = "ss"
query_mode = "filter"

[[groups]]
name = "proj"
query_mode = "filter"

[[groups]]
name = "cheats"
query_mode = "filter"

[[groups]]
name = "scripts"
query_mode = "filter"

# Service inspection passes the typed unit name to the selected command.

[[shortcuts]]
group     = "svc"
label     = "systemctl status: "
base      = "systemctl status {query}"
mode      = "shell"

[[shortcuts]]
group     = "svc"
label     = "systemctl show: "
base      = "systemctl show {query}"
mode      = "shell"

[[shortcuts]]
group     = "svc"
label     = "systemctl cat: "
base      = "systemctl cat {query}"
mode      = "shell"

[[shortcuts]]
group     = "svc"
label     = "journalctl -u (this boot): "
base      = "journalctl -u {query} -b"
mode      = "shell"

[[shortcuts]]
group     = "svc"
label     = "journalctl -u (recent errors): "
base      = "journalctl -u {query} -xe"
mode      = "shell"

[[shortcuts]]
group = "docs"
label = "Nim language documentation"
base  = "https://nim-lang.org/docs/"
mode  = "url"

[[shortcuts]]
group = "docs"
label = "Go package documentation"
base  = "https://pkg.go.dev/"
mode  = "url"

[[shortcuts]]
group = "docs"
label = "Python documentation"
base  = "https://docs.python.org/3/"
mode  = "url"

[[shortcuts]]
group = "docs"
label = "Free Pascal documentation"
base  = "https://www.freepascal.org/docs.html"
mode  = "url"

[[shortcuts]]
group     = "cheats"
label     = "Helix keybindings"
base      = "exec \"$HOME/.local/bin/helix-cheatsheet\""
mode      = "shell"
run_mode  = "terminal"
stay_open = false

[[shortcuts]]
group     = "cheats"
label     = "Kitty shortcuts"
base      = "exec \"$HOME/.local/bin/kitty-cheatsheet\""
mode      = "shell"
run_mode  = "terminal"
stay_open = false

[[shortcuts]]
group     = "cheats"
label     = "Neovim keybindings"
base      = "exec \"$HOME/.local/bin/nvim-cheatsheet\""
mode      = "shell"
run_mode  = "terminal"
stay_open = false

[[shortcuts]]
group     = "ss"
label     = "Screenshot area -> clipboard"
base      = "grim -g \"$(slurp)\" - | wl-copy"
mode      = "shell"
run_mode  = "spawn"

[[shortcuts]]
group     = "ss"
label     = "Screenshot area -> save"
base      = "mkdir -p ~/Pictures/Screenshots && grim -g \"$(slurp)\" ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png"
mode      = "shell"
run_mode  = "spawn"

[[shortcuts]]
group     = "ss"
label     = "Full screenshot -> clipboard"
base      = "grim - | wl-copy"
mode      = "shell"
run_mode  = "spawn"

[[shortcuts]]
group     = "ss"
label     = "Full screenshot -> save"
base      = "mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date '+%Y-%m-%d_%H-%M-%S').png"
mode      = "shell"
run_mode  = "spawn"

# ==========================
# Script integrations
# ==========================

[[shortcuts]]
prefix    = ":m"
label     = "Calculate: "
base      = "res=$(echo {query} | bc -l); echo \"$res\" | wl-copy; notify-send 'Calculator' \"Result: $res\" -i accessories-calculator"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "scripts"
label     = "Audio Sink"
base      = "$HOME/.config/nimlaunch/scripts/nimlaunch_audio.sh"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "scripts"
label     = "Window Switcher"
base      = "$HOME/.config/nimlaunch/scripts/nimlaunch_windows.sh"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "scripts"
label     = "Steam Games"
base      = "$HOME/.config/nimlaunch/scripts/nimlaunch_steam.sh"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "scripts"
label     = "Clipboard Manager (Hyprland)"
base      = "$HOME/.config/nimlaunch/scripts/nimlaunch_cliphist.sh"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "scripts"
label     = "Clipboard Manager (KDE Klipper)"
base      = "$HOME/.config/nimlaunch/scripts/nimlaunch_klipper.sh"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "scripts"
label     = "WiFi Network Manager"
base      = "$HOME/.config/nimlaunch/scripts/nimlaunch_wifi.sh"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "scripts"
label     = "Bluetooth Manager"
base      = "$HOME/.config/nimlaunch/scripts/nimlaunch_bluetooth.sh"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "sys"
label     = "Lock session"
base      = "loginctl lock-session"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "sys"
label     = "Suspend system"
base      = "systemctl suspend"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "sys"
label     = "Log out"
base      = "loginctl terminate-user \"$USER\""
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "sys"
label     = "Reboot system"
base      = "systemctl reboot"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "sys"
label     = "Shut down system"
base      = "systemctl poweroff"
mode      = "shell"
run_mode  = "spawn"
stay_open = false

[[shortcuts]]
group     = "proj"
label     = "NimLaunch repo"
base      = "~/Projects/Gits/github/Vyrnexis/NimLaunch"
mode      = "file"

[[shortcuts]]
group     = "proj"
label     = "Nymph"
base      = "~/Projects/Gits/github/Vyrnexis/Nymph"
mode      = "file"

[[shortcuts]]
group     = "proj"
label     = "Solus Welcome App"
base      = "~/Projects/Gits/github/Vyrnexis/welcome-app"
mode      = "file"

[[shortcuts]]
group     = "proj"
label     = "Omawrite Standalone"
base      = "~/Projects/Gits/github/Vyrnexis/Omawrite-Standalone"
mode      = "file"

