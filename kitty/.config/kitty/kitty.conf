# vim:ft=kitty

# ==============================================================================
# Fonts
# ==============================================================================
font_family      GeistMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14.0
disable_ligatures never

# ==============================================================================
# Cursor customization
# ==============================================================================
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ==============================================================================
# Window layout & UI
# ==============================================================================
# Adds a nice breathing room around the edges of the terminal
window_padding_width 8

# Removes the title bar for a cleaner look
hide_window_decorations no

# Suppress the "close window" confirmation warning
confirm_os_window_close 0

# ==============================================================================
# Tab bar (If you open multiple tabs in Kitty)
# ==============================================================================
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style   bold
inactive_tab_font_style normal

# ==============================================================================
# Color scheme
# ==============================================================================
include dracula-theme.conf

# Background transparency (Change to 0.90 or 0.85 if you want it see-through)
background_opacity 1.0
# background_blur 1

# ==============================================================================
# Advanced & Performance
# ==============================================================================
# Allow other programs to control kitty (useful for some Neovim plugins)
allow_remote_control yes
listen_on unix:@mykitty

# Better rendering
sync_to_monitor yes
